    <title>TrackARC</title>
    <script>
      // Apply the saved theme BEFORE anything renders. Without this, dark
      // mode only turned on once a screen containing the theme toggle
      // mounted — the boot screen, sign-in and onboarding all flashed (or
      // stayed) white for dark-mode users.
      (function () {
        try {
          var saved = localStorage.getItem("trackmaster_theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) { /* storage blocked — default to light */ }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-Czm08jIe.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DPttW2zv.css">

    <div id="root"></div>
    <script>
      // Offline support for the hosted web app only — never on file://
      // (desktop build) or inside Capacitor.
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        navigator.serviceWorker.register("./sw.js");
      }
    </script>
  </body>
